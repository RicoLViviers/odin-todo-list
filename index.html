<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document</title><script defer="defer" src="main.js"></script></head><body><div class="content"><div id="content-header"><h1>Todo List</h1><button id="add-task">Add Task</button></div><div class="seperator"></div><table id="todo-table"><tr><th>Title</th><th>Description</th><th>Due Date</th><th>Priority</th><th>State</th><th>Edit</th><th>Delete</th></tr></table><dialog id="task-form"><form method="dialog"><h2>Add a Task</h2><label for="title">Title:</label> <input id="title" placeholder="Task title"> <label for="description">Description:</label> <input id="description" placeholder="Task description"> <label for="due-date">Due Date:</label> <input type="date" id="due-date"> <label for="priority">Priority:</label> <select id="priority"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select> <button type="submit">Submit</button></form></dialog></div></body></html>
